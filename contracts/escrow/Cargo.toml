[package]
name = "remitx-escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
ed25519-dalek = "=2.2.0"

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
debug = false
codegen-units = 1

[features]
testutils = ["soroban-sdk/testutils"]