name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps || npm install --no-audit
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:coverage
      - run: npm run build
      # Known transitive wallet-kit advisories are tracked in docs/SECURITY-NOTES.md,
      # so this step is reported but does not block merges yet.
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [contracts, core]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.dir }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Build contracts to wasm
        if: matrix.dir == 'contracts'
        run: cargo build --release --target wasm32-unknown-unknown --workspace
      - run: cargo install cargo-audit --locked
      # Transitive soroban-sdk advisory is documented in docs/SECURITY-NOTES.md.
      - run: cargo audit
        continue-on-error: true
